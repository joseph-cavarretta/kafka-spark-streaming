[project]
name = "kafka-spark-streaming"
version = "0.1.0"
description = "Real-time event streaming pipeline: Kafka -> Spark -> Cassandra"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro]>=2.15.0",
    "fastavro>=1.9.0",
    "pydantic>=2",
    "pyspark>=4.2.0",
    "requests>=2.32.0",
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3.0",
]
# What each container installs (uv sync --only-group <name>). The consumer leaves out
# pyspark: spark-submit puts the Spark image's own pyspark on the path.
producer = [
    "confluent-kafka[avro]>=2.15.0",
    "pydantic>=2",
    "requests>=2.32.0",
    "tenacity>=8",
]
consumer = [
    "confluent-kafka[avro]>=2.15.0",
    "fastavro>=1.9.0",
    "pydantic>=2",
    "requests>=2.32.0",
]

[tool.ruff]
extend = "../agent-dev-harness/python-styleguide/ruff-base.toml"

[tool.ruff.lint.isort]
known-first-party = ["producer", "streaming_config"]

[tool.mypy]
strict = true
# Same loose paths as the lint baseline: scripts/ and .local/ are not checked.
exclude = ['(^|/)scripts/', '(^|/)\.local/']

[[tool.mypy.overrides]]
# confluent_kafka.avro ships partial stubs that don't export or type the
# Avro producer/schema-registry helpers used here. Treat it as a boundary.
module = ["confluent_kafka.*"]
follow_imports = "skip"
